<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shift results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.9; }
</style>
</helmet>

<div style="width: 390px; height: 844px; background: #0e1116; color: #e7ebf1; font-family: 'IBM Plex Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Score -->
  <div style="padding: 34px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-bottom: 1px solid #262c37;">
    <div style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 3px; color: #9aa3b1;">SHIFT CLEARED</div>
    <div style="font-family: 'Chakra Petch', sans-serif; font-size: 52px; font-weight: 700; line-height: 1;">3,160</div>
    <div style="font-family: 'Chakra Petch', sans-serif; font-size: 14px; color: #9aa3b1;">TARGET 2,400 · 5 OF 6 CORRECT</div>
  </div>

  <!-- Rank up -->
  <div style="margin: 18px 20px 6px; padding: 18px; border-radius: 12px; border: 2px solid #3ecfb2; background: #12201e; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; letter-spacing: 2px; color: #3ecfb2;">RANK UP</div>
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 22px; font-weight: 700; color: #3ecfb2;">II</span>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 20px; font-weight: 700;">Competent → Proficient</span>
    </div>
    <div style="display: flex; gap: 4px;">
      <div style="width: 22px; height: 10px; border-radius: 2px; background: #3ecfb2;"></div>
      <div style="width: 22px; height: 10px; border-radius: 2px; background: #3ecfb2;"></div>
      <div style="width: 22px; height: 10px; border-radius: 2px; background: #3ecfb2;"></div>
      <div style="width: 22px; height: 10px; border-radius: 2px; background: #3ecfb2;"></div>
      <div style="width: 22px; height: 10px; border-radius: 2px; background: #262c37;"></div>
    </div>
    <div style="font-size: 14px; line-height: 1.45; color: #cbd2dc;">Patch bond 4 is open tonight.</div>
  </div>

  <!-- Other gains -->
  <div style="padding: 14px 20px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
    <div style="font-family: 'Chakra Petch', sans-serif; font-size: 12px; letter-spacing: 2px; color: #9aa3b1;">PROGRESS TO NEXT RANK</div>
    <sc-for list="{{gains}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;">
          <span><span style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: {{g.color}};">{{g.id}}</span> <span style="color: #cbd2dc;">{{g.name}}</span></span>
          <span style="font-family: 'Chakra Petch', sans-serif; color: #cbd2dc;">{{g.delta}}</span>
        </div>
        <div style="height: 8px; background: #1f242d; border-radius: 4px; overflow: hidden; display: flex;">
          <div style="{{g.before}}"></div>
          <div style="{{g.added}}"></div>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding: 14px; border-radius: 10px; background: #171b22; border: 1px solid #262c37;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 14px; font-weight: 600;">Calibration</div>
        <div style="font-size: 13px; color: #9aa3b1;">4 of 4 "Sure" calls were right</div>
      </div>
      <div style="font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700; color: #3ecfb2;">SHARP</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 10px; background: #171b22; border: 1px solid #262c37;">
      <div style="font-size: 14px; font-weight: 600;">Readiness projection</div>
      <div style="font-family: 'Chakra Petch', sans-serif; font-size: 18px; font-weight: 700;">2041 → <span style="color: #3ecfb2;">2040</span></div>
    </div>
  </div>

  <div style="padding: 16px 20px 26px;">
    <a href="Bond.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; background: #3ecfb2; color: #0e1116; border-radius: 10px; font-family: 'Chakra Petch', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1px;">TO THE EVENING</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var raw = [
      { id: 'III', name: 'Practices', color: '#e8a33d', before: 40, added: 25 },
      { id: 'I', name: 'Healthcare', color: '#5b8def', before: 55, added: 15 },
      { id: 'IV', name: 'Professional', color: '#6fbf73', before: 20, added: 0 }
    ];
    var gains = raw.map(function (g) {
      return {
        id: g.id, name: g.name, color: g.color,
        delta: g.added ? '+' + g.added + '%' : 'missed',
        before: 'height: 100%; width: ' + g.before + '%; background: ' + g.color + '; opacity: 0.45;',
        added: 'height: 100%; width: ' + g.added + '%; background: ' + g.color + ';'
      };
    });
    return { gains: gains };
  }
}
</script>
</body>
</html>
